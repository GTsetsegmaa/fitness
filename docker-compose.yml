# The whole stack. Settings come from .env (copy .env.example).
#   Local:  docker compose up -d --build        -> https://localhost
#   VPS:    set DOMAIN in .env, then the same command
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_DB: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18 images keep their data under this path
    ports:
      # host:container. Reachable from this machine (npm run dev), never from the internet.
      # Host port 5433, not 5432, so it doesn't clash with a Postgres installed on the machine.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-off job: apply any new migrations in drizzle/, then exit.
  # Uses the Dockerfile's "build" stage, which has drizzle-kit and the source code.
  migrate:
    build:
      context: .
      target: build
    command: ["npx", "drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgres://fitness:${POSTGRES_PASSWORD}@db:5432/fitness
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fitness:${POSTGRES_PASSWORD}@db:5432/fitness
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully # never start against an unmigrated database

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    environment:
      DOMAIN: ${DOMAIN:-localhost}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
